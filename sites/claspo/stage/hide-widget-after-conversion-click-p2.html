<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hide widget after conversion click - Page 2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Space+Grotesk:wght@400;600&display=swap');

        :root {
            --bg-top: #dbeafe;
            --bg-bottom: #dcfce7;
            --accent: #0f766e;
            --accent-ink: #f0fdfa;
            --ink: #0f172a;
            --muted: #334155;
            --panel: rgba(255, 255, 255, 0.8);
            --panel-border: rgba(15, 118, 110, 0.2);
            --shadow: rgba(15, 23, 42, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
            font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 12%, rgba(16, 185, 129, 0.18), transparent 40%),
                radial-gradient(circle at 85% 18%, rgba(59, 130, 246, 0.22), transparent 45%),
                linear-gradient(135deg, var(--bg-top), var(--bg-bottom));
        }

        main {
            width: min(640px, 100%);
            padding: 36px 40px;
            border-radius: 28px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: 0 20px 40px var(--shadow);
            backdrop-filter: blur(10px);
            animation: float-in 700ms ease-out both;
        }

        .tag {
            display: inline-flex;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(15, 118, 110, 0.12);
            color: var(--accent);
            font-size: 0.75rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            font-weight: 600;
        }

        h1 {
            margin: 18px 0 6px;
            font-family: "Fraunces", "Times New Roman", serif;
            font-size: clamp(2.1rem, 4vw, 3.2rem);
            line-height: 1.1;
        }

        .page {
            margin: 0;
            font-size: 1.1rem;
            color: var(--muted);
        }

        .cta {
            margin-top: 26px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--accent-ink);
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 12px 20px rgba(15, 118, 110, 0.35);
            transition: transform 160ms ease, box-shadow 160ms ease;
        }

        .cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 24px rgba(15, 118, 110, 0.35);
        }

        .cta:focus-visible {
            outline: 3px solid rgba(15, 118, 110, 0.4);
            outline-offset: 3px;
        }

        @keyframes float-in {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            main {
                padding: 28px 24px;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="tag">[display rules]</div>
        <h1>Stop after conversion click</h1>
        <p class="page">Page 2</p>
        <a class="cta" href="hide-widget-after-conversion-click-p1.html">Go to page 1</a>
    </main>

        var s = e.createElement(c);
        s.async = 1, s.src = 'https://scripts.claspo.tech/scripts/' + n + '.js';

</script><script>claspo('init');</script>

    <script src="../../js/master.js"></script>
</body>
</html>
