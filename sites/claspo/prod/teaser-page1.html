<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claspo Prod Teaser - Page 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.45;
        }

        .test-panel {
            max-width: 640px;
            padding: 20px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0;
        }

        button,
        a.button-link {
            display: inline-flex;
            align-items: center;
            min-height: 40px;
            padding: 0 14px;
            border: 1px solid #0969da;
            border-radius: 6px;
            background: #0969da;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            text-decoration: none;
        }

        .click-target {
            margin-top: 16px;
            padding: 18px;
            border: 1px dashed #0969da;
            border-radius: 8px;
            cursor: pointer;
            background: #f6f8fa;
        }

        #click-status {
            margin-top: 16px;
            font-weight: 700;
        }
    </style>
</head>
<body data-test-page="page1">
    <main class="test-panel">
        <h1>Claspo Prod Teaser</h1>
        <h2>Page 1</h2>

        <p>Test page with Claspo script, navigation to Page 2, and clickable elements.</p>

        <div class="actions">
            <a class="button-link" id="go-page-2" href="./teaser-page2.html">Go to Page 2</a>
            <button id="test-click" type="button">Test click</button>
            <button id="ow" type="button">Open widget area</button>
        </div>

        <div class="click-target" id="click-target" role="button" tabindex="0">
            Click target block
        </div>

        <p id="click-status">Clicks on this page: 0</p>
    </main>

    <script>
    !function (t, e, c, n) {
        var s = e.createElement(c);
        s.async = 1, s.src = 'https://scripts.claspo.io/scripts/' + n + '.js';
        var r = e.scripts[0];
        r.parentNode.insertBefore(s, r);
        var f = function () {
            f.c(arguments);
        };
        f.q = [];
        f.c = function () {
            f.q.push(arguments);
        };
        t['claspo'] = t['claspo'] || f;
    }(window, document, 'script', '7C6832A7AF9044FA8FADB8B1F3AF2772');
    </script>
    <script>claspo('init');</script>

    <script src="../../js/master.js"></script>

    <script>
        (function () {
            var clicks = 0;
            var status = document.getElementById('click-status');
            var targets = [
                document.getElementById('test-click'),
                document.getElementById('ow'),
                document.getElementById('click-target')
            ];

            function updateStatus(label) {
                clicks += 1;
                status.textContent = 'Clicks on this page: ' + clicks + ' (last: ' + label + ')';
                console.log('[teaser-page1] click', label, clicks);
            }

            targets.forEach(function (target) {
                target.addEventListener('click', function () {
                    updateStatus(target.id);
                });

                target.addEventListener('keydown', function (event) {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        target.click();
                    }
                });
            });
        }());
    </script>
</body>
</html>
