<script>
const payload = JSON.parse(document.getElementById('encryptedPayload').textContent);
const form = document.getElementById('unlockForm');
const passwordInput = document.getElementById('password');
const button = document.getElementById('unlockButton');
const status = document.getElementById('status');

function fromB64(value) {
  return Uint8Array.from(atob(value), char => char.charCodeAt(0));
}

async function deriveKey(password, salt) {
  const baseKey = await crypto.subtle.importKey(
    'raw',
    new TextEncoder().encode(password),
    'PBKDF2',
    false,
    ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: payload.iterations, hash: payload.hash },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  status.textContent = '';
  button.disabled = true;
  button.textContent = 'Відкриваю...';

  try {
    const key = await deriveKey(passwordInput.value, fromB64(payload.salt));
    const decrypted = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: fromB64(payload.iv) },
      key,
      fromB64(payload.ciphertext)
    );
    const html = new TextDecoder().decode(decrypted);
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    status.textContent = 'Не вдалося відкрити. Перевір пароль.';
    button.disabled = false;
    button.textContent = 'Відкрити';
  }
});
</script>
